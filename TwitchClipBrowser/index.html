<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twitch Clips Monthly Browser</title>

<style>
:root { color-scheme: dark; }
body {
  margin:0; font-family:system-ui;
  background:#0e0e10; color:#efeff1;
}
header {
  position:sticky; top:0; z-index:10;
  background:#111; border-bottom:1px solid #2a2a2d;
}
.wrap { max-width:1100px; margin:auto; padding:14px; }
.row { display:grid; grid-template-columns:1fr 1fr 1fr auto auto; gap:10px; }
input,select,button {
  background:#18181b; color:#fff;
  border:1px solid #2a2a2d; border-radius:8px;
  padding:8px;
}
button { cursor:pointer; }
button.primary { background:#9147ff; border-color:#9147ff; }

main { max-width:1100px; margin:auto; padding:14px; }
.grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
}
@media(max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} }

.card {
  background:#18181b; border:1px solid #2a2a2d;
  border-radius:12px; overflow:hidden;
}
.thumb { position:relative; aspect-ratio:16/9; cursor:pointer; }
.thumb img { width:100%; height:100%; object-fit:cover; }
.play {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:48px; background:rgba(0,0,0,.35);
}
.meta { padding:10px; font-size:12px; }
.title { font-weight:700; margin-bottom:6px; }
.sub { color:#adadb8; display:flex; flex-wrap:wrap; gap:6px; }
iframe { width:100%; aspect-ratio:16/9; border:0; }
</style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="row">
      <input id="clientId" placeholder="Client ID">
      <input id="channel" placeholder="login or user_id">
      <input id="month" type="month">
      <select id="sort">
        <option value="date">新しい順</option>
        <option value="views">視聴数順</option>
      </select>
      <button id="connect" class="primary">Connect</button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
const API = "https://api.twitch.tv/helix";
const AUTH = "https://id.twitch.tv/oauth2/authorize";
const LS_TOKEN = "twitch_token";
const LS_CID   = "twitch_cid";

let state = {
  token:null, cid:null, after:null,
  broadcaster:null, clips:[], videos:{}, games:{},
  loading:false
};

const $ = id=>document.getElementById(id);

function auth() {
  localStorage.setItem(LS_CID,$("clientId").value);
  location.href = AUTH +
   `?client_id=${$("clientId").value}` +
   `&redirect_uri=${location.origin+location.pathname}` +
   `&response_type=token`;
}

function consumeToken(){
  if(!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const t = p.get("access_token");
  if(t){
    localStorage.setItem(LS_TOKEN,t);
    history.replaceState(null,"",location.pathname);
  }
}

async function helix(url){
  const r = await fetch(API+url,{
    headers:{
      "Client-Id":state.cid,
      "Authorization":"Bearer "+state.token
    }
  });
  return r.json();
}

async function resolveUser(u){
  if(/^\d+$/.test(u)) return u;
  const j = await helix(`/users?login=${u}`);
  return j.data[0].id;
}

function monthRange(m){
  const [y,mo]=m.split("-");
  const s=new Date(Date.UTC(y,mo-1,1)).toISOString();
  const e=new Date(Date.UTC(y,mo,1)).toISOString();
  return [s,e];
}

async function loadClips(){
  if(state.loading) return;
  state.loading=true;

  const [s,e]=monthRange($("month").value);
  const q = new URLSearchParams({
    broadcaster_id:state.broadcaster,
    started_at:s, ended_at:e, first:100
  });
  if(state.after) q.set("after",state.after);

  const j = await helix(`/clips?${q}`);
  state.after=j.pagination?.cursor||null;
  state.clips.push(...j.data);

  await enrichVideos(j.data);
  render();
  state.loading=false;
}

async function enrichVideos(clips){
  const vids=[...new Set(clips.map(c=>c.video_id).filter(Boolean))];
  for(const id of vids){
    if(state.videos[id]) continue;
    const v=await helix(`/videos?id=${id}`);
    if(!v.data[0]) continue;
    state.videos[id]=v.data[0];

    const gid=v.data[0].game_id;
    if(gid && !state.games[gid]){
      const g=await helix(`/games?id=${gid}`);
      if(g.data[0]) state.games[gid]=g.data[0].name;
    }
  }
}

function render(){
  const sort=$("sort").value;
  const arr=[...state.clips];
  arr.sort((a,b)=>
    sort==="views"
      ? b.view_count-a.view_count
      : new Date(b.created_at)-new Date(a.created_at)
  );

  $("grid").innerHTML=arr.map(c=>{
    const v=state.videos[c.video_id];
    const game=v?state.games[v.game_id]:"";
    const thumb=c.thumbnail_url.replace("%{width}",480).replace("%{height}",270);
    return `
<div class="card">
  <div class="thumb" data-clip="${c.id}">
    <img src="${thumb}">
    <div class="play">▶</div>
  </div>
  <div class="meta">
    <div class="title">${c.title}</div>
    <div class="sub">
      <span>${game||""}</span>
      <span>${c.view_count} views</span>
      <span>${new Date(c.created_at).toLocaleDateString()}</span>
    </div>
  </div>
</div>`;
  }).join("");
}

$("grid").onclick=e=>{
  const t=e.target.closest(".thumb");
  if(!t) return;
  const id=t.dataset.clip;
  t.outerHTML=`
<iframe
 src="https://clips.twitch.tv/embed?clip=${id}&parent=brahmoon.github.io"
 allowfullscreen>
</iframe>`;
};

$("connect").onclick=auth;

consumeToken();
state.token=localStorage.getItem(LS_TOKEN);
state.cid=localStorage.getItem(LS_CID);

window.addEventListener("scroll",()=>{
  if(innerHeight+scrollY>document.body.offsetHeight-600)
    loadClips();
});

(async()=>{
  if(!state.token) return;
  state.broadcaster=await resolveUser($("channel").value);
  await loadClips();
})();
</script>
</body>
</html>
